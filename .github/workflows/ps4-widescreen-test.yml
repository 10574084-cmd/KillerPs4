name: Killer Instinct PS4 PKG

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ps4:
    runs-on: ubuntu-latest
    steps:
      - name: Check out KillerPs4
        uses: actions/checkout@v4

      - name: Check out pinned UltraCombo KI1 machine core
        uses: actions/checkout@v4
        with:
          repository: thefixinhixon/UltraCombo
          ref: b7ae26e7605efbe53cb60433ade26d5579900d8e
          path: deps/UltraCombo

      - name: Check out the official create-fself source
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/create-fself
          ref: v1.3
          path: deps/create-fself

      - name: Set up Go for create-fself
        uses: actions/setup-go@v5
        with:
          go-version: '1.17'

      - name: Build create-fself for the Linux runner
        working-directory: deps/create-fself/cmd/create-fself
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tools/bin"
          go build -o "$GITHUB_WORKSPACE/tools/bin/create-fself" -modfile=go-linux.mod

      - name: Fetch the pinned OpenOrbis sample module
        run: |
          mkdir -p sce_sys/about
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/OpenOrbis/OpenOrbis-PS4-Toolchain/0a1aaf9dd4a92695538bdeb09fb056d06dd11725/samples/piglet/sce_sys/about/right.sprx" \
            --output sce_sys/about/right.sprx
          test -s sce_sys/about/right.sprx

      - name: Build PS4 ELF and PKG with the official OpenOrbis container
        run: |
          docker run --rm --user root \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:latest \
            bash -lc 'apt-get update && apt-get install -y python3 && make clean all'

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: Killer-Instinct-PS4
          path: |
            *.pkg
            eboot.bin
            build/killer_instinct_ps4.elf
            build/killer_instinct_ps4.oelf
            build/libki1core.a
          if-no-files-found: error
