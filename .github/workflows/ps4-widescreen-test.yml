name: KI1 Widescreen Test PKG

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ps4:
    runs-on: ubuntu-latest
    steps:
      - name: Check out KillerPs4
        uses: actions/checkout@v4

      - name: Build PS4 ELF and PKG with the official OpenOrbis container
        run: |
          docker run --rm --user root \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:latest \
            bash -lc 'apt-get update && apt-get install -y python3 && make clean all'

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: KI1-Widescreen-Test-PS4
          path: |
            *.pkg
            eboot.bin
            build/ki1_widescreen_test.elf
            build/ki1_widescreen_test.oelf
          if-no-files-found: error
